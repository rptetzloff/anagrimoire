# The sitemap's <lastmod> dates are committed rather than computed at build
# time, because Render builds without usable git history — the first version
# computed them with `git log` and shipped 33 URLs and no dates at all.
#
# So the dates are only as fresh as the last `npm run lastmod`. This checks
# they're current rather than fixing them: a bot commit here would land after
# Render has already started building and cost a second deploy every merge.
# A red check that says which command to run is cheaper than that.
name: Sitemap lastmod is current

on:
  pull_request:
    paths:
      - 'src/**'
      - 'data/route-lastmod.json'
      - 'scripts/route-lastmod.mjs'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # full history: the script computes dates from it and refuses to run
      # against a shallow clone, which is the whole point of doing this here
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/route-lastmod.mjs
      - name: Fail if the committed dates are stale
        run: |
          if ! git diff --exit-code -- data/route-lastmod.json; then
            echo "::error::data/route-lastmod.json is out of date — run 'npm run lastmod' and commit the result"
            exit 1
          fi
